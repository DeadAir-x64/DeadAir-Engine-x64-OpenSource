# [DA_PORT] Автоматический запуск отключён, остался ручной (workflow_dispatch).
#
# Это наследство OpenXRay, и в форке оно падало бы на каждом pull request: сборка требует SDK
# NVIDIA DLSS и Intel XeSS, которых в репозитории нет по условиям их лицензий (см. README, раздел
# «Сборка»), а проверка стиля ругается на код порта. Красные крестики у каждого предложения
# отпугивают сильнее, чем отсутствие проверок.
#
# Свой CI под этот форк — отдельная задача. До тех пор запускать вручную со вкладки Actions.

name: "Pull Request Labeler"

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-slim
    steps:
    - name: on new pull request
      if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.opened == true || github.event.pull_request.reopened == true }}
      uses: actions/labeler@v6.0.1
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: .github/labeler_on_new_pr.yml

    - name: on any pull request
      if: ${{ github.event_name == 'pull_request_target' }}
      uses: actions/labeler@v6.0.1
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: .github/labeler.yml

    - name: on pull request approval
      if: ${{ github.event_name == 'pull_request_review' && github.event.review.state == 'approved' }}
      uses: actions/labeler@v6.0.1
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: .github/labeler_on_pr_approved.yml

    - name: on pull request merged
      if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merged == true }}
      uses: actions/labeler@v6.0.1
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: .github/labeler_on_pr_merged.yml
